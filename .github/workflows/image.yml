name: Trial image

# Builds the image used by the GitHub Codespaces trial, with the release's data bundle baked in,
# tests it like a user would and publishes it to ghcr.io/<owner>/ultrahofs:<version>.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (its ultrahofs-data-*.tar.gz asset is baked into the image)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch the release data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'ultrahofs-data-*.tar.gz' --dir "$RUNNER_TEMP"
          mkdir -p deploy/seed
          tar -xzf "$RUNNER_TEMP"/ultrahofs-data-*.tar.gz -C deploy/seed --strip-components=1
          cat deploy/seed/manifest.json

      - name: Build
        run: docker build -f deploy/Dockerfile -t ultrahofs:test .

      - name: Test (default start with MACE-OFF24 relaxation, Codespaces lifecycle)
        run: bash deploy/test-image.sh ultrahofs:test 8000

      - name: Publish to GitHub Container Registry
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ultrahofs"
          VERSION="${TAG#v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "$VERSION" latest; do
            docker tag ultrahofs:test "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Published \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
