[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrahofs"
version = "0.1.0"
description = "UltraHOFs: hydrogen-bonded organic framework design platform (Ultra-X)"
requires-python = ">=3.11"
# rdkit, pymatgen, ase, spglib, gemmi and zeo++ come from conda-forge (see ../environment.yml).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "numpy",
  "scipy",
  "networkx",
  "py2opsin>=1.0",
]

[project.optional-dependencies]
relax = ["mace-torch>=0.3.10", "torch"]
nets = ["pormake>=0.2.3"]  # only for scripts/build_net_cache.py
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
ultrahofs = "ultrahofs.cli:main"

[tool.setuptools.packages.find]
include = ["ultrahofs*"]

[tool.setuptools.package-data]
ultrahofs = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (structure relaxation, large builds)",
  "network: tests that need internet access",
]
addopts = "-m 'not slow and not network'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
