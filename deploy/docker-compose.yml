# Production-style stack (for a company server; not for NERSC login nodes).
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml exec api ultrahofs create-user --username admin --role admin
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultrahofs
      POSTGRES_USER: ultrahofs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultrahofs"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ultrahofs:0.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ULTRAHOFS_DATABASE_URL: postgresql+psycopg://ultrahofs:${POSTGRES_PASSWORD}@db:5432/ultrahofs
      ULTRAHOFS_SECRET_KEY: ${ULTRAHOFS_SECRET_KEY:?set ULTRAHOFS_SECRET_KEY}
      ULTRAHOFS_CROSSREF_MAILTO: ${ULTRAHOFS_CROSSREF_MAILTO:-}
      ULTRAHOFS_CORS_ORIGINS: '["https://${PUBLIC_HOST:-localhost}"]'
      ULTRAHOFS_ENVIRONMENT: production
    volumes:
      - ultrahofs-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    image: ultrahofs:0.1.0
    restart: unless-stopped
    depends_on:
      - api
    command: ["ultrahofs", "worker"]
    environment:
      ULTRAHOFS_DATABASE_URL: postgresql+psycopg://ultrahofs:${POSTGRES_PASSWORD}@db:5432/ultrahofs
      ULTRAHOFS_SECRET_KEY: ${ULTRAHOFS_SECRET_KEY}
      ULTRAHOFS_MAX_RELAX_ATOMS: ${ULTRAHOFS_MAX_RELAX_ATOMS:-4000}
      ULTRAHOFS_RELAX_DEVICE: ${ULTRAHOFS_RELAX_DEVICE:-auto}
    volumes:
      - ultrahofs-data:/data
    # Uncomment on a GPU host with the NVIDIA container toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  pgdata:
  ultrahofs-data:
